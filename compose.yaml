services:
  ticket-agent:
    build: .
    image: ticket-agent:latest
    container_name: ticket-agent
    restart: unless-stopped
    env_file: .env
    ports:
      - "8097:8097"   # dashboard on the LAN
    volumes:
      - ./data:/data          # SQLite DB
      - ./config:/config:ro   # config.yaml (edit on the host, no rebuild)
    mem_limit: 256m
