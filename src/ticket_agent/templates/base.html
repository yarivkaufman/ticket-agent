<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ticket Agent{% endblock %}</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #fff; --text: #1b1f24; --muted: #5f6b7a; --border: #e3e6ea;
  --accent: #2f6fde; --good: #1f8a4c; --bad: #c0392b;
  /* chart series = condition: new / refurbished / used (validated reference slots 1-3) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grid: #e7e8ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --surface: #1a1f25; --text: #e7eaee; --muted: #9aa4b1; --border: #2a313a;
    --accent: #6ea0ff; --good: #4cc27f; --bad: #ef6b5e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #2a2f36;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
header { background: var(--surface); border-bottom: 1px solid var(--border); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header .wrap { display: flex; align-items: center; gap: 16px; height: 56px; }
header h1 { font-size: 17px; margin: 0; } header h1 a { color: var(--text); }
header nav { margin-left: auto; display: flex; gap: 14px; font-size: 14px; }
main { padding: 20px 0 48px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tab { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
  background: var(--surface); font-size: 14px; }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab .n { opacity: .75; margin-left: 4px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
.toolbar input[type=text] { flex: 1; min-width: 240px; }
input, select, button, textarea { font: inherit; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); }
button { cursor: pointer; } button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--bad); }
button[disabled] { opacity: .6; cursor: default; }
.notice { color: var(--muted); font-size: 14px; }
.meta { color: var(--muted); font-size: 13.5px; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--muted); }
.pill.warn { color: var(--bad); border-color: var(--bad); }
.pill.ok { color: var(--good); border-color: var(--good); }
.scan-tip { position: relative; cursor: default; outline: none; }
.scan-tip-box { display: none; position: absolute; right: 0; top: 100%; z-index: 10; margin-top: 6px;
  width: max-content; max-width: min(460px, 90vw); padding: 10px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  box-shadow: 0 6px 20px rgba(0,0,0,.15); font-size: 13px; line-height: 1.45; }
.scan-tip-box ul { margin: 6px 0; padding-left: 18px; }
.scan-tip:hover .scan-tip-box, .scan-tip:focus .scan-tip-box, .scan-tip:focus-within .scan-tip-box { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 10px; }
.card .title { font-weight: 600; font-size: 16px; }
.prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.price { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.price .cond { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.price .amt { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.k1 { background: var(--s1); } .k2 { background: var(--s2); } .k3 { background: var(--s3); }
.hit-target { color: var(--good); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.panel h2 { font-size: 15px; margin: 0 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
form.inline { display: inline; margin: 0; }
table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 14px; }
td, th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.out td { opacity: .55; }
.settings { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; align-items: center; }
.settings input[type=text] { width: 100%; }
/* chart */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .tick, .chart .endlabel { fill: var(--muted); font-size: 12px; }
.chart .endlabel { fill: var(--text); }
.chart .line { stroke: var(--s1); fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .key { stroke-width: 2; }
.chart .s1 { stroke: var(--s1); } .chart .s2 { stroke: var(--s2); } .chart .s3 { stroke: var(--s3); }
.chart .dot.s1 { fill: var(--s1); } .chart .dot.s2 { fill: var(--s2); } .chart .dot.s3 { fill: var(--s3); }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .dot { fill: var(--s1); }
.chart .target { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .endlabel.muted { fill: var(--good); }
.chart .cross { stroke: var(--muted); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart-wrap { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  white-space: nowrap; display: none; }
@media (max-width: 640px) {
  .prices { grid-template-columns: 1fr; }
  .settings { grid-template-columns: 1fr; }
  header nav { gap: 10px; }
  table { display: block; overflow-x: auto; }
}
</style>
</head>
<body>
<header><div class="wrap">
  <h1><a href="/">Ticket Agent</a></h1>
  <nav><a href="/">Events</a><a href="/runs">Runs</a></nav>
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
